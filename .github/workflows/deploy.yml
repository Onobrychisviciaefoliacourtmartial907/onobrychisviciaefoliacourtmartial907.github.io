name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A844DC: ${{ secrets.A844DC }}
          BFA6E6: ${{ secrets.BFA6E6 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A844DC', '')
          meta_b = os.environ.get('BFA6E6', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 12e5026ba75543e3d83a6c070ecc08dc -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 75300de06d5de36a -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
