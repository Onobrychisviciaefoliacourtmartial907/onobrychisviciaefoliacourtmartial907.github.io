name: Build and deploy website

on:
  # Manual trigger: GitHub → Actions → "Build and deploy website" → Run workflow
  workflow_dispatch:
  # Automatic rebuild whenever something is pushed/uploaded to main.
  # Delete these three lines if you only want to update the site manually.
  push:
    branches: [main]

permissions:
  contents: write   # lets the workflow save the updated cv/*.docx and cv/*.pdf
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-docx (for the Word CV)
        run: pip install python-docx
      - name: Give .ris files standard names (year-author-title.ris)
        run: python scripts/rename_ris.py
      - name: Build site from pages/, data/ and publications/*.ris
        run: python scripts/build.py --cv-files
      - name: Save renamed .ris files and updated CV files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A publications cv
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Tidy .ris file names / update CV files [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
